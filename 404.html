<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 — Not Found</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230A1D2C'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='64' fill='%23C8F23F' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3EFE3;--ink:#0A1D2C;--lime:#C8F23F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;padding:32px}
.wrap{max-width:560px;text-align:left}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.72;margin-bottom:22px}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(56px,11vw,116px);
  line-height:.92;letter-spacing:-.02em;margin:0 0 8px}
.hl{background:var(--lime);padding:.08em .2em .13em;border-radius:.1em;display:inline-block;line-height:1.02}
p{font-size:.92rem;font-weight:500;line-height:1.65;max-width:48ch;margin:20px 0}
a.btn{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border:1.5px solid var(--ink);border-radius:999px;padding:11px 22px;color:var(--ink);text-decoration:none;transition:.15s}
a.btn:hover{background:var(--ink);color:var(--paper)}
hr{border:none;border-top:1px solid rgba(10,29,44,.26);margin:30px 0}
.tiny{font-size:.72rem;opacity:.7;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Error — No. 404</div>
  <h1>Nothing<br>measured<br><span class="hl">here.</span></h1>
  <p>That path does not exist. Which, in a document about traceable measurement, is at least honest — an absent reading is better than a fabricated one.</p>
  <hr>
  <a class="btn" href="./">← Back to the brief</a>
  <p class="tiny" style="margin-top:26px">The Metrology Dividend · Venture &amp; Immigration Brief</p>
</div>
</body>
</html>
